<!DOCTYPE html>
<html>
<head>
<title>ParkWatch — Officer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  input, button { font-size: 16px; padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; }
  button { background: #1a1a1a; color: white; border: none; cursor: pointer; }
  #status { padding: 12px; border-radius: 6px; margin-top: 12px; font-weight: bold; }
  .valid { background: #d4f7dc; color: #1a7a34; }
  .violation { background: #fbd9d9; color: #b3261e; }
  #log { margin-top: 16px; font-size: 13px; color: #555; max-height: 200px; overflow-y: auto; }
  .connected { color: green; } .disconnected { color: red; }
</style>
</head>
<body>
  <h2>ParkWatch — Officer</h2>
  <p>Status: <span id="conn-status" class="disconnected">disconnected</span></p>

  <input id="officer-id" placeholder="Officer ID" value="officer1">
  <button onclick="connect()">Connect</button>

  <hr>

  <input id="plate" placeholder="Plate number" value="NBY3978">
  <input id="zone" placeholder="Zone ID" value="1">
  <button onclick="checkPlate()">Check Plate</button>

  <div id="status"></div>
  <div id="log"></div>

<script>
let ws = null;

function connect() {
  const officerId = document.getElementById('officer-id').value;
  const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/officer/${officerId}`);

  ws.onopen = () => {
    document.getElementById('conn-status').textContent = 'connected';
    document.getElementById('conn-status').className = 'connected';
    log('Connected as ' + officerId);
  };

  ws.onclose = () => {
    document.getElementById('conn-status').textContent = 'disconnected';
    document.getElementById('conn-status').className = 'disconnected';
    log('Disconnected');
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    log('Received: ' + JSON.stringify(data));

    const statusDiv = document.getElementById('status');
    if (data.type === 'check_result' && data.valid) {
      statusDiv.className = 'valid';
      statusDiv.textContent = '✅ Valid permit';
    } else if (data.type === 'violation.created') {
      statusDiv.className = 'violation';
      statusDiv.textContent = `🚫 Violation: ${data.reason}${data.duplicate ? ' (duplicate)' : ''}`;
    }
  };
}

function checkPlate() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { alert('Connect first'); return; }
  const plate = document.getElementById('plate').value;
  const zone = parseInt(document.getElementById('zone').value);
  ws.send(JSON.stringify({ action: 'check_plate', plate, zone_id: zone }));
  log('Sent check for ' + plate);
}

function log(msg) {
  const logDiv = document.getElementById('log');
  logDiv.innerHTML = `<div>${new Date().toLocaleTimeString()} — ${msg}</div>` + logDiv.innerHTML;
}

// send a location update every 8 seconds once connected (simulated GPS)
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    const lat = 38.9218 + (Math.random() - 0.5) * 0.002;
    const lng = -77.0195 + (Math.random() - 0.5) * 0.002;
    ws.send(JSON.stringify({ action: 'location_update', lat, lng }));
  }
}, 8000);
</script>
</body>
</html>
